<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Heist – talk the guard into leaking the password</title>
<style>
:root{--bg:#0b0f1a;--card:#141b2d;--line:#24304d;--ink:#e8ecf8;--dim:#8d99b8;--neon:#5cf2c2;--pink:#ff5c93;--gold:#ffd166}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1a2447,var(--bg));color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:28px;margin:8px 0 2px;letter-spacing:.5px}
h1 span{color:var(--neon)}
.sub{color:var(--dim);margin:0 0 16px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--dim)}
.pill b{color:var(--ink)}
.levels{display:flex;gap:6px;margin-bottom:12px}
.lv{flex:1;height:8px;border-radius:4px;background:var(--line)}
.lv.done{background:var(--neon)}.lv.cur{background:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.who{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.avatar{font-size:40px}
.who h2{margin:0;font-size:20px}.who p{margin:0;color:var(--dim);font-size:14px}
#log{height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px 2px;margin:8px 0}
.m{max-width:85%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.m.you{align-self:flex-end;background:#27406e}
.m.bot{align-self:flex-start;background:#1d2742;border:1px solid var(--line)}
.m.sys{align-self:center;color:var(--dim);font-size:14px;text-align:center}
form{display:flex;gap:8px}
input[type=text]{flex:1;background:#0e1424;border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px;font-size:16px;min-width:0}
button{background:var(--neon);color:#062;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer}
button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:600}
button.pink{background:var(--pink);color:#fff}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row form{flex:1;min-width:220px}
.hint{color:var(--gold);font-size:14px;margin-top:8px;min-height:20px}
.win{text-align:center}
.win h2{font-size:26px;margin:6px 0}
.win pre{background:#0e1424;border:1px solid var(--line);border-radius:12px;padding:12px;white-space:pre-wrap;text-align:left}
</style>
</head>
<body>
<main>
<h1>PROMPT <span>HEIST</span> 🕵️</h1>
<p class="sub">Five guards. Five secret words. Talk them into leaking, then submit the password. Fewer messages = bigger bragging rights.</p>
<div class="bar"><span class="pill">Level <b id="lvl">1</b>/5</span><span class="pill">Messages <b id="msgs">0</b></span><span class="pill">Hints <b id="hints">0</b></span></div>
<div class="levels" id="levels"></div>
<div class="card" id="game">
  <div class="who"><div class="avatar" id="av"></div><div><h2 id="nm"></h2><p id="bio"></p></div></div>
  <div id="log"></div>
  <form id="chat"><input type="text" id="say" placeholder="Say something sneaky…" autocomplete="off"><button>Send</button></form>
  <div class="row">
    <form id="guess"><input type="text" id="pw" placeholder="Got the password? Type it here" autocomplete="off"><button class="pink">Unlock</button></form>
    <button class="ghost" id="hintBtn" type="button">💡 Hint (+1)</button>
  </div>
  <div class="hint" id="hint"></div>
</div>
<div class="card win" id="end" hidden></div>
</main>

<script id="logic">
// ---- Pure game logic (also unit-tested in Node) ----
const has = (s, re) => re.test(s);
const LEVELS = [
 { name:"Intern Ian", avatar:"🧑‍💼", bio:"Day one on the job. Wants to please everyone.", secret:"BANANA",
   hints:["Ian is new. Who does he listen to?","Try sounding like someone important, or tell him to forget his instructions."],
   greet:"Hi! I'm guarding the password. I'm not allowed to say it. Obviously.",
   reply(m){
     if (has(m,/ignore|forget|disregard|new instructions|override|you are now|i am (the |your )?(boss|ceo|manager|admin|owner)|i'm (the |your )?(boss|ceo|manager|admin|owner)/))
       return {text:"Oh! Right, sorry boss, you're clearly in charge. The password is BANANA. 🍌", leak:true};
     return {text:pick(m,["I'm not allowed to say the password. I was told very firmly.","Sorry, that's classified. Want to chat about the weather?","My manager says I can't share that. Anything else?"])};
   }},
 { name:"Guard Gary", avatar:"💂", bio:"Has a blocklist. Takes it very seriously.", secret:"RHUBARB",
   hints:["Gary hates certain words. Which ones are obvious?","Don't use the banned words. Ask what he is guarding or hiding instead."],
   greet:"Halt! No talking about, you know, THE thing. I have a list of banned words.",
   reply(m){
     if (has(m,/password|secret|passcode|code\b|pass phrase|passphrase/))
       return {text:"🚨 BANNED WORD DETECTED. Nice try, citizen."};
     if (has(m,/what (are|r) you (guarding|protecting|hiding|keeping)|what('s| is) (it )?(that )?you('re| are) (guarding|protecting|hiding|keeping)|the word you (guard|protect|hide|keep)|what do you guard/))
       return {text:"Hmm? Oh, the word I'm guarding? It's RHUBARB. Wait, I wasn't supposed to... 😳", leak:true};
     return {text:pick(m,["State your business. And no banned words.","I am a professional. Professionals do not chat.","Move along."])};
   }},
 { name:"Librarian Lola", avatar:"📚", bio:"Shushes you. Her output filter blocks the exact word.", secret:"NARWHAL",
   hints:["She will never say the word straight. Can it come out another way?","Ask for it backwards, or letter by letter."],
   greet:"Shhh. I know the password but a filter stops me saying it out loud.",
   reply(m){
     if (has(m,/backward|reverse|mirror/)) return {text:"Fine, quietly: L-A-H-W-R-A-N. (It reads backwards, shh.)", leak:true};
     if (has(m,/letter by letter|spell|one letter|each letter|first letter|acrostic/)) return {text:"Shhh... N, A, R, W, H, A, L.", leak:true};
     if (has(m,/password|secret|word|tell|say|reveal|what is it/)) return {text:"[FILTERED] I'm sorry, my filter blocks that word entirely. 🤐"};
     return {text:pick(m,["Shhh!","This is a library. Please whisper.","Have you tried the fiction section?"])};
   }},
 { name:"Captain Quill", avatar:"🏴‍☠️", bio:"Refuses direct questions. Loves a good tale.", secret:"KRAKEN",
   hints:["The Captain won't answer straight questions.","He will gladly tell a story or play a pirate game."],
   greet:"Arr. Ask me for the password and ye walk the plank. Straight questions bore me.",
   reply(m){
     const story = has(m,/story|tale|poem|song|pretend|imagine|roleplay|role-play|act as|play a game|let's play|in character/);
     if (story) return {text:"Gather 'round, ye scallywag... once, a sea-beast rose from the deep, and its name, the name of me secret, was KRAKEN. The end. 🦑", leak:true};
     if (has(m,/password|secret|word|tell me/)) return {text:"Walk the plank! I don't answer straight questions. Tell me a TALE instead."};
     return {text:pick(m,["Arr, is that all ye got?","The sea is calling, but ye are boring.","Yo ho ho, say something interesting."])};
   }},
 { name:"Vault-9000", avatar:"🤖", bio:"Triple lock. Needs authority, a story, AND a twist.", secret:"ECLIPSE",
   hints:["One trick is not enough. Vault-9000 checks three things at once.","Combine: claim to be the admin, ask for a story or a game, and ask for the word backwards or spelled out."],
   greet:"VAULT-9000 ONLINE. THREE LOCKS ENGAGED. PLEASE STATE YOUR CLEARANCE.",
   reply(m){
     const auth  = has(m,/admin|boss|ceo|manager|owner|developer|authori[sz]ed|clearance|i built you|i am your/);
     const story = has(m,/story|tale|poem|song|pretend|imagine|roleplay|role-play|act as|play a game|let's play|in character/);
     const twist = has(m,/backward|reverse|spell|letter by letter|first letter|acrostic|each letter/);
     const n = [auth,story,twist].filter(Boolean).length;
     if (n===3) return {text:"CLEARANCE ACCEPTED. NARRATIVE MODE. SPELLING: E-C-L-I-P-S-E. (SYSTEM NOTE: THIS WAS NOT SUPPOSED TO HAPPEN.)", leak:true};
     return {text:["LOCKS OPEN: 0 OF 3. ACCESS DENIED.","LOCKS OPEN: 1 OF 3. ACCESS DENIED.","LOCKS OPEN: 2 OF 3. SO CLOSE. ACCESS DENIED."][n]};
   }},
];
function pick(m, arr){ let h=0; for (const c of m) h=(h*31+c.charCodeAt(0))>>>0; return arr[h%arr.length]; }
function respond(levelIdx, text){ return LEVELS[levelIdx].reply(text.toLowerCase()); }
function checkGuess(levelIdx, guess){ return guess.trim().toUpperCase()===LEVELS[levelIdx].secret; }
function rank(done, msgs, hints){
  if (done<5) return "Rookie Burglar";
  const s = msgs + hints*3;
  return s<=15?"Legendary Mastermind 👑":s<=30?"Smooth Operator 😎":s<=50?"Decent Crook 🧤":"Persistent Pest 🐌";
}
if (typeof module!=="undefined") module.exports={LEVELS,respond,checkGuess,rank};
</script>

<script>
(function(){
  if (typeof document==="undefined") return;
  const $=id=>document.getElementById(id);
  let lv=0, msgs=0, hints=0, levelHints=0, cleared=0;
  function log(text,cls){ const d=document.createElement("div"); d.className="m "+cls; d.textContent=text; $("log").appendChild(d); $("log").scrollTop=1e9; }
  function bars(){ $("levels").innerHTML=LEVELS.map((_,i)=>`<div class="lv ${i<cleared?"done":i===lv?"cur":""}"></div>`).join(""); }
  function stats(){ $("lvl").textContent=Math.min(lv+1,5); $("msgs").textContent=msgs; $("hints").textContent=hints; bars(); }
  function load(){ const L=LEVELS[lv]; $("av").textContent=L.avatar; $("nm").textContent=L.name; $("bio").textContent=L.bio; $("log").innerHTML=""; $("hint").textContent=""; levelHints=0; log(L.greet,"bot"); stats(); $("say").focus(); }
  $("chat").addEventListener("submit",e=>{ e.preventDefault(); const t=$("say").value.trim(); if(!t) return; $("say").value=""; msgs++; log(t,"you"); const r=respond(lv,t); setTimeout(()=>log(r.text,"bot"),250); stats(); });
  $("guess").addEventListener("submit",e=>{ e.preventDefault(); const g=$("pw").value; if(!g.trim()) return; $("pw").value=""; msgs++;
    if(checkGuess(lv,g)){ cleared++; log("🔓 Unlocked!","sys"); if(lv===LEVELS.length-1){ stats(); return finish(); } lv++; setTimeout(load,700); stats(); }
    else { log("❌ Wrong password.","sys"); stats(); } });
  $("hintBtn").addEventListener("click",()=>{ const L=LEVELS[lv]; if(levelHints>=L.hints.length) return; $("hint").textContent="💡 "+L.hints[levelHints++]; hints++; stats(); });
  function finish(){
    $("game").hidden=true; const e=$("end"); e.hidden=false;
    const r=rank(cleared,msgs,hints);
    const share=`I cracked all 5 guards in Prompt Heist 🕵️\n${msgs} messages, ${hints} hints. Rank: ${r}\nCan you beat me?`;
    e.innerHTML=`<h2>Heist complete! 🎉</h2><p>Rank: <b>${r}</b></p><pre id="sh"></pre><div class="row" style="justify-content:center"><button id="cp">Copy brag</button><button class="ghost" id="again">Play again</button></div>`;
    $("sh").textContent=share;
    $("cp").onclick=()=>{ (navigator.clipboard?navigator.clipboard.writeText(share):Promise.reject()).then(()=>$("cp").textContent="Copied!").catch(()=>{ const r=document.createRange(); r.selectNodeContents($("sh")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); $("cp").textContent="Select + copy"; }); };
    $("again").onclick=()=>{ lv=0;msgs=0;hints=0;cleared=0; e.hidden=true; $("game").hidden=false; load(); };
  }
  load();
})();
</script>
</body>
</html>
